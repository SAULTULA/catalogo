/* ====================================================================
   OS WEB SKIN: Mac OS Vibrant (Big Sur)
   Familia: mac  |  id: mac-bigsur-vibrant
   Big Sur con acentos vívidos multicolor y superficies translúcidas.
   ==================================================================== */

:root, .osw-mac-bigsur-vibrant {
  /* --- Paleta --- */
  --osw-bg:            linear-gradient(160deg,#dfe9f3,#c9d6ff);
  --osw-bg-elevated:   #ffffffd9;
  --osw-surface:       #ffffffe6;
  --osw-border:        #c7d2e0;
  --osw-text:          #1c1c1e;
  --osw-text-muted:    #5b5b60;
  --osw-accent:        #ff375f;
  --osw-accent-text:   #ffffff;
  --osw-titlebar-bg:   #ffffffcc;
  --osw-titlebar-text: #1c1c1e;

  /* --- Formas / tipografía --- */
  --osw-radius:        14px;
  --osw-radius-sm:     10px;
  --osw-font:          -apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif;
  --osw-shadow:        0 20px 45px rgba(0,0,0,.22);
  --osw-titlebar-height: 40px;
}

.osw-mac-bigsur-vibrant {
  background: var(--osw-bg);
  color: var(--osw-text);
  font-family: var(--osw-font);
  min-height: 100%;
}

/* Ventana estilo Mac OS Vibrant (Big Sur) */
.osw-mac-bigsur-vibrant .osw-window {
  background: var(--osw-surface);
  border: 1px solid var(--osw-border);
  border-radius: var(--osw-radius);
  box-shadow: var(--osw-shadow);
  overflow: hidden;
}

.osw-mac-bigsur-vibrant .osw-titlebar {
  height: var(--osw-titlebar-height);
  background: var(--osw-titlebar-bg);
  color: var(--osw-titlebar-text);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  backdrop-filter: blur(24px);
}

.osw-mac-bigsur-vibrant .osw-titlebar-title {
  flex: 1;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  opacity: .85;
}

.osw-mac-bigsur-vibrant .osw-controls {
  display: flex;
  gap: 8px;
  order: -1;
}
.osw-mac-bigsur-vibrant .osw-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.osw-mac-bigsur-vibrant .osw-dot.close  { background: #ff5f57; }
.osw-mac-bigsur-vibrant .osw-dot.min    { background: #febc2e; }
.osw-mac-bigsur-vibrant .osw-dot.max    { background: #28c840; }

.osw-mac-bigsur-vibrant .osw-content {
  padding: 16px;
}

.osw-mac-bigsur-vibrant .osw-button {
  background: var(--osw-accent);
  color: var(--osw-accent-text);
  border: none;
  border-radius: var(--osw-radius-sm);
  padding: 8px 16px;
  font-family: var(--osw-font);
  font-size: 14px;
  cursor: pointer;
  
}

.osw-mac-bigsur-vibrant .osw-card {
  background: var(--osw-bg-elevated);
  border: 1px solid var(--osw-border);
  border-radius: var(--osw-radius-sm);
  padding: 12px;
}
